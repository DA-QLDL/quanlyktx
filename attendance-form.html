<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Điểm danh KTX Hóc Môn</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./qr-config.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#edf4ff;color:#15294b;font:14px/1.5 system-ui,sans-serif;min-height:100dvh;display:grid;place-items:center;padding:16px}.card{background:white;width:min(530px,100%);border-radius:19px;padding:25px;border:1px solid #d6e4f6;box-shadow:0 12px 38px #1737661a}h1{margin:5px 0;font-size:23px}.mut{color:#59728d}label{display:block;margin-top:14px;font-weight:650;font-size:12px}input,select{display:block;width:100%;margin-top:5px;padding:13px;border:1px solid #d0dff1;border-radius:10px;font:inherit}button{cursor:pointer;border:0;border-radius:11px;padding:13px 16px;font:inherit;font-weight:800;background:#2468e9;color:white;width:100%;margin-top:18px}button:disabled{opacity:.55}.tip{padding:12px;background:#edf5ff;border-radius:11px;margin-top:18px}.msg{margin-top:12px;font-weight:650;white-space:pre-wrap}.bad{color:#be2440}.good{color:#07824f}.brand{font-weight:900;color:#2265d9}</style></head><body><main class="card"><div class="brand">KÝ TÚC XÁ HÓC MÔN</div><h1>Điểm danh công nhân bằng QR</h1><div class="mut">Nhập thông tin theo hồ sơ KTX và chọn điểm danh <b>Vào</b> hoặc <b>Ra</b>. Ban quản lý sẽ xác nhận trước khi ghi nhận chính thức.</div><form id="attForm"><label>Mã nhân viên *<input name="worker_code" required maxlength="60" autocomplete="off"></label><label>Họ và tên *<input name="worker_name" required maxlength="120"></label><label>KTX *<select name="ktx" required><option value="">Chọn KTX</option><option>KTX 1</option><option>KTX 2</option></select></label><label>Loại điểm danh *<select name="direction" required><option value="in">Điểm danh Vào</option><option value="out">Điểm danh Ra</option></select></label><button type="submit" id="send">Gửi điểm danh</button></form><div id="result" class="msg" role="status"></div><div class="tip mut">Mã QR dùng chung không xác nhận danh tính tự động. Chỉ khi Ban quản lý đối chiếu và duyệt, dữ liệu mới chuyển sang bảng điểm danh.</div></main><script>
const sid=new URLSearchParams(location.search).get('session');
async function ensureSession(){if(!sid)return true; if(!/^[0-9a-f-]{36}$/i.test(sid))throw Error('Mã phiên không hợp lệ.');const {data,error}=await sb.from('ktx_attendance_sessions').select('id,session_day,ktx,status').eq('id',sid).maybeSingle();if(error||!data)throw Error('Không tìm thấy phiên điểm danh.');if(data.status!=='open')throw Error('Phiên điểm danh đã đóng.');const now=new Date().toLocaleDateString('en-CA');if(data.session_day!==now)throw Error('Mã QR không có hiệu lực hôm nay.');if(data.ktx){const choice=form.querySelector('[name="ktx"]');choice.value=data.ktx;choice.disabled=true;}return data;}
const form=document.getElementById('attForm'),msg=document.getElementById('result'),btn=document.getElementById('send');let sb;try{const c=window.KTX_QR_CONFIG||{};if(!/^https:\/\//.test(c.url)||!c.key)throw Error('Chưa cấu hình kết nối QR.');sb=supabase.createClient(c.url,c.key,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}})}catch(e){msg.textContent=e.message;msg.className='msg bad';btn.disabled=true}
form.addEventListener('submit',async e=>{e.preventDefault();if(!sb)return;const fd=new FormData(form);const payload={worker_code:String(fd.get('worker_code')||'').trim(),worker_name:String(fd.get('worker_name')||'').trim(),ktx:String(fd.get('ktx')||''),direction:String(fd.get('direction')||'in')};if(!payload.worker_code||!payload.worker_name||!payload.ktx)return;btn.disabled=true;msg.textContent='Đang gửi...';msg.className='msg';try{const session=await ensureSession();if(sid){payload.session_id=sid;if(session.ktx&&payload.ktx!==session.ktx)throw Error('Sai KTX của phiên.')}const {error}=await sb.from('ktx_attendance_qr_requests').insert(payload);if(error)throw error;msg.textContent='Đã gửi yêu cầu điểm danh. Vui lòng chờ Ban quản lý xác nhận.';msg.className='msg good';form.reset()}catch(err){msg.textContent='Không gửi được: '+(err.message||err)+'. Kiểm tra thiết lập bảng điểm danh QR trên Supabase.';msg.className='msg bad'}finally{btn.disabled=false}});
</script><script src="./cccd-scan.js"></script></body></html>
