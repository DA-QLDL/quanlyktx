<div class="fac-header"><div><h2>Quản lý Cơ sở vật chất</h2><p>Theo dõi và cập nhật trang thiết bị từng phòng/khu vực</p></div><div class="fac-actions"><button class="btn primary" id="exportTop">↓ Xuất Excel</button><button class="btn primary" id="importTop">↑ Import Excel</button><button class="btn primary" id="addTop">＋ Thêm phòng mới</button></div></div>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script src="excel-import.js"></script><script>
(()=>{'use strict';const key='ktx_step169_cosovatchat';const cols=["KTX", "Dãy", "Phòng/Khu vực", "Giường", "Điều hòa", "Tủ", "Quạt", "Ổ cắm điện", "Remote", "Bóng tuýp", "Bàn ăn", "Ghế ăn", "Ghi chú"];const nums=new Set([3, 4, 5, 6, 7, 8, 9, 10, 11]);let data=[],editing=-1;const $=x=>document.getElementById(x);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));try{const v=JSON.parse(localStorage.getItem(key)||'[]');data=Array.isArray(v)?v:[]}catch{}function persist(){try{localStorage.setItem(key,JSON.stringify(data));$('msg').textContent='Đã lưu '+data.length+' bản ghi trên trình duyệt.'}catch(e){$('msg').textContent='Không lưu được: '+e.message+' — hãy xuất JSON ngay.'}}let activeKtx='1';function getKtx(r){const x=String(r['KTX']??'').trim();const m=x.match(/(?:ktx\s*)?(\d+)/i);return m?m[1]:x}function getRows(){const q=$('search').value.toLocaleLowerCase('vi');const day=$('dayFilter').value;return data.map((r,i)=>({...r,_i:i})).filter(r=>(activeKtx==='all'||getKtx(r)===activeKtx)&&(!day||String(r['Dãy']??'')===day)&&(!q||cols.some(k=>String(r[k]??'').toLocaleLowerCase('vi').includes(q))))}function refreshDays(){const old=$('dayFilter').value;const vals=[...new Set(data.filter(r=>activeKtx==='all'||getKtx(r)===activeKtx).map(r=>String(r['Dãy']??'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'vi',{numeric:true}));$('dayFilter').innerHTML='<option value="">Tất cả Dãy</option>'+vals.map(v=>'<option value="'+esc(v)+'">'+esc(v)+'</option>').join('');if(vals.includes(old))$('dayFilter').value=old}function render(){refreshDays();const rows=getRows();const items=[['Giường','▣'],['Điều hòa','↔'],['Tủ','⬡'],['Quạt','✿'],['Ổ cắm điện','ϟ'],['Remote','▤'],['Bóng tuýp','◉'],['Bàn ăn','▥'],['Ghế ăn','▧']];$('facStats').innerHTML=items.map(([k,ic])=>'<div class="fac-stat"><span class="ic">'+ic+'</span><small>'+esc(k)+'</small><b>'+rows.reduce((a,r)=>a+(Number(r[k])||0),0).toLocaleString('vi-VN')+'</b></div>').join('');$('facTableTitle').innerHTML=''+(activeKtx==='all'?'Toàn KTX':'KTX '+activeKtx)+' — '+rows.length+' phòng/khu vực <small>· Hiển thị theo bộ lọc hiện tại</small>';$('thead').innerHTML='<tr>'+cols.map(c=>'<th>'+esc(c)+'</th>').join('')+'<th>Thao tác</th></tr>';$('tbody').innerHTML=rows.map(r=>'<tr>'+cols.map((c,i)=>'<td>'+(i===0?'<span class="fac-pill">'+esc(r[c]??'')+'</span>':esc(r[c]??''))+'</td>').join('')+'<td><div class="fac-rowactions"><button data-edit="'+r._i+'" title="Sửa">✎ Sửa</button><button class="danger" data-del="'+r._i+'" title="Xóa">♲ Xóa</button></div></td></tr>').join('')||'<tr><td colspan="'+(cols.length+1)+'" class="fac-empty">Chưa có phòng hoặc khu vực phù hợp bộ lọc.</td></tr>';$('ktxTabs').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.ktx===activeKtx))}function show(i){editing=i;const r=data[i]||{};$('editor').classList.remove('hide');$('editTitle').textContent=i<0?'Thêm bản ghi':'Chỉnh sửa bản ghi';$('fields').innerHTML=cols.map((c,j)=>'<label>'+esc(c)+'<input data-col="'+j+'" '+(nums.has(j)?'type="number" min="0" step="1"':'type="text"')+' value="'+esc(r[c]??'')+'"></label>').join('');$('editor').scrollIntoView({behavior:'smooth',block:'start'})}function hide(){$('editor').classList.add('hide');editing=-1} $('add').onclick=()=>show(-1);$('cancel').onclick=hide;$('save').onclick=()=>{const r={};$('fields').querySelectorAll('input').forEach(el=>{const i=Number(el.dataset.col);r[cols[i]]=nums.has(i)?(el.value===''?'':Number(el.value)):el.value.trim()});if(editing<0)data.push(r);else data[editing]=r;persist();hide();render()};$('tbody').onclick=e=>{const a=e.target.closest('button');if(!a)return;if(a.dataset.edit!==undefined)show(Number(a.dataset.edit));if(a.dataset.del!==undefined&&confirm('Xóa bản ghi này?')){data.splice(Number(a.dataset.del),1);persist();render()}};$('search').oninput=render;$('dayFilter').onchange=render;$('ktxTabs').onclick=e=>{const b=e.target.closest('[data-ktx]');if(!b)return;activeKtx=b.dataset.ktx;$('dayFilter').value='';render()};$('exportTop').onclick=()=>$('export').click();$('addTop').onclick=()=>show(-1);$('importTop').onclick=()=>{const btn=[...document.querySelectorAll('button')].find(b=>/Import Excel/i.test(b.textContent));if(btn&&btn!==$('importTop'))btn.click();else alert('Chức năng Import Excel chưa được tải. Kiểm tra file excel-import.js trên GitHub.');};async function download(blob,name,types){if(window.showSaveFilePicker){try{const h=await showSaveFilePicker({suggestedName:name,types});const f=await h.createWritable();await f.write(blob);await f.close();return}catch(e){if(e.name==='AbortError')return}}const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}function csv(){const quote=v=>'"'+String(v??'').replace(/"/g,'""')+'"';return '﻿'+[cols,...data.map(r=>cols.map(c=>r[c]??''))].map(x=>x.map(quote).join(',')).join('\r\n')};$('export').onclick=async()=>{const name='cosovatchat_'+new Date().toISOString().slice(0,10);if(window.XLSX){const ws=XLSX.utils.json_to_sheet(data.length?data.map(r=>Object.fromEntries(cols.map(c=>[c,r[c]??'']))):[Object.fromEntries(cols.map(c=>[c,'']))],{header:cols});const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Du lieu');const buf=XLSX.write(wb,{type:'array',bookType:'xlsx'});await download(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),name+'.xlsx',[{description:'Excel',accept:{'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet':['.xlsx']}}])}else{await download(new Blob([csv()],{type:'text/csv;charset=utf-8'}),name+'.csv',[{description:'CSV',accept:{'text/csv':['.csv']}}]);$('msg').textContent='Thư viện XLSX không tải được; đã xuất CSV thay thế.'}};$('backup').onclick=()=>download(new Blob([JSON.stringify({module:key,columns:cols,rows:data},null,2)],{type:'application/json'}),key+'.json',[{description:'JSON',accept:{'application/json':['.json']}}]);$('restore').onclick=()=>$('jsonFile').click();$('jsonFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const p=JSON.parse(await f.text());if(p.module!==key||!Array.isArray(p.rows))throw Error('File không thuộc đúng tiện ích.');if(!confirm('Nhập file sẽ thay toàn bộ dữ liệu cục bộ của tiện ích này, tiếp tục?'))return;data=p.rows;persist();render()}catch(err){alert('Lỗi nhập: '+err.message)}e.target.value=''};window.KTXExcelImporter?.init({toolbar:'.toolbar',columns:cols,numericFields:[...nums].map(i=>cols[i]),dateFields:cols.filter(c=>/ngày|thời gian/i.test(c)),getRecords:()=>data.slice(),setRecords:merged=>{try{localStorage.setItem(key,JSON.stringify(merged));data=merged;render();return true}catch(e){return false}}});render()})();
</script><script src="./utility-cloud.js?v=175" defer></script></body></html>
