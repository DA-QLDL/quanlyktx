<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Checklist bình PCCC</title><style>
:root{font-family:Arial,sans-serif;color:#183153;background:#f1f6ff;font-size:13px}*{box-sizing:border-box}body{margin:0;padding:18px}.card{background:white;border:1px solid #d3e1f3;border-radius:12px;padding:16px;margin-bottom:12px}h2{margin:0 0 7px;font-size:21px}p{color:#657995;margin:5px 0 15px}.toolbar{display:flex;flex-wrap:wrap;gap:9px;margin:12px 0}.btn{border-radius:8px;border:1px solid #c4d6ee;background:#fff;color:#184a9b;padding:10px 12px;cursor:pointer;font-weight:700;min-height:36px}.primary{background:#2369e9;color:white;border-color:#2369e9}.danger{color:#ad2733}.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}label{display:flex;flex-direction:column;gap:5px;font-size:11px;font-weight:700;color:#536a86}input,select{border:1px solid #cddaf0;border-radius:8px;padding:9px;min-width:0;width:100%;font-size:13px;background:#fff;color:#233958}.tablewrap{max-width:100%;overflow:auto;border:1px solid #d4e2f3;border-radius:9px}table{border-collapse:collapse;min-width:900px;width:100%}th{background:#eaf2ff;color:#214f90;text-align:left;white-space:nowrap}th,td{padding:9px;border-bottom:1px solid #e4eaf3}tbody tr:nth-child(even){background:#f7faff}.status{font-size:12px;color:#55739a}.summary{display:flex;gap:12px;flex-wrap:wrap}.stat{border:1px solid #cfe0f4;border-radius:10px;padding:10px 16px;background:#f9fbff}.stat b{font-size:19px;color:#1251a9}.stat small{display:block;color:#64748b}.note{padding:11px;background:#fff9eb;border:1px solid #f0e3be;border-radius:8px;color:#845f16}.rowbtn{white-space:nowrap}.filter{max-width:400px}.hint{font-size:11px;color:#617d9c}.hide{display:none}@media(max-width:750px){body{padding:8px}.fields{grid-template-columns:1fr 1fr}}@media(max-width:480px){.fields{grid-template-columns:1fr}}
</style><style id="step173-utility-visual-standard">
:root{--ui-space:10px}button,input,select,textarea{box-sizing:border-box}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #2563eb;outline-offset:2px}input,select,textarea{max-width:100%}button{min-height:34px}main,section,.card{min-width:0}@media(max-width:640px){body{overflow-x:hidden}table{max-width:100%}}
</style><style id="step178-utility-height">

#impPreview{max-height:min(48dvh,550px)!important;min-height:170px;overflow:auto!important;overscroll-behavior:contain}

</style></head><body><div class="card"><h2>Checklist bình PCCC</h2><p>Quản lý hồ sơ theo mẫu đã cung cấp, có thể thêm, sửa, xóa dòng và xuất Excel.</p><div class="summary" id="summary"></div><div class="toolbar"><button class="btn primary" id="add">+ Thêm bản ghi</button><button class="btn" id="export">↓ Xuất Excel</button><button class="btn" id="backup">↓ Sao lưu JSON</button><button class="btn" id="restore">↑ Nhập JSON</button><input class="hide" type="file" id="jsonFile" accept=".json"><input class="filter" id="search" placeholder="Tìm kiếm trong sổ..."></div><div class="note">Dữ liệu tiện ích hiện lưu trên thiết bị đang sử dụng, chưa đồng bộ Supabase. Hãy sao lưu JSON hoặc xuất Excel định kỳ. Các file Excel gốc được đính kèm riêng trong bản ZIP để đối chiếu.</div></div><div class="card"><div id="editor" class="hide"><h3 id="editTitle">Thêm bản ghi</h3><div class="fields" id="fields"></div><div class="toolbar"><button class="btn primary" id="save">Lưu bản ghi</button><button class="btn" id="cancel">Hủy</button></div></div><div class="tablewrap"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div><p class="hint" id="msg"></p></div>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script src="excel-import.js"></script><script>
(()=>{'use strict';const key='ktx_step169_pccc';const cols=["Ngày kiểm tra", "KTX", "Dãy", "Vị trí/bình", "Loại bình", "Số lượng", "Áp suất", "Vòi", "Chốt/khóa", "Dây", "Kết quả", "Người kiểm tra", "Ghi chú"];const nums=new Set([5]);let data=[],editing=-1;const $=x=>document.getElementById(x);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));try{const v=JSON.parse(localStorage.getItem(key)||'[]');data=Array.isArray(v)?v:[]}catch{}function persist(){try{localStorage.setItem(key,JSON.stringify(data));$('msg').textContent='Đã lưu '+data.length+' bản ghi trên trình duyệt.'}catch(e){$('msg').textContent='Không lưu được: '+e.message+' — hãy xuất JSON ngay.'}}function render(){const q=$('search').value.toLowerCase();const rows=data.map((r,i)=>({...r,_i:i})).filter(r=>cols.some(k=>String(r[k]??'').toLowerCase().includes(q)));$('thead').innerHTML='<tr><th>STT</th>'+cols.map(c=>'<th>'+esc(c)+'</th>').join('')+'<th>Thao tác</th></tr>';$('tbody').innerHTML=rows.map((r,i)=>'<tr><td>'+(i+1)+'</td>'+cols.map(c=>'<td>'+esc(r[c])+'</td>').join('')+'<td class="rowbtn"><button class="btn" data-edit="'+r._i+'">Sửa</button> <button class="btn danger" data-del="'+r._i+'">Xóa</button></td></tr>').join('')||'<tr><td colspan="'+(cols.length+2)+'">Chưa có bản ghi.</td></tr>';$('summary').innerHTML='<div class="stat"><small>Số dòng đã lưu</small><b>'+data.length+'</b></div>'+(nums.length?'<div class="stat"><small>Tổng '+esc(cols[nums[0]])+'</small><b>'+data.reduce((a,r)=>a+(Number(r[cols[nums[0]]])||0),0).toLocaleString('vi-VN')+'</b></div>':'');}function show(i){editing=i;const r=data[i]||{};$('editor').classList.remove('hide');$('editTitle').textContent=i<0?'Thêm bản ghi':'Chỉnh sửa bản ghi';$('fields').innerHTML=cols.map((c,j)=>'<label>'+esc(c)+'<input data-col="'+j+'" '+(nums.has(j)?'type="number" min="0" step="1"':'type="text"')+' value="'+esc(r[c]??'')+'"></label>').join('');$('editor').scrollIntoView({behavior:'smooth',block:'start'})}function hide(){$('editor').classList.add('hide');editing=-1} $('add').onclick=()=>show(-1);$('cancel').onclick=hide;$('save').onclick=()=>{const r={};$('fields').querySelectorAll('input').forEach(el=>{const i=Number(el.dataset.col);r[cols[i]]=nums.has(i)?(el.value===''?'':Number(el.value)):el.value.trim()});if(editing<0)data.push(r);else data[editing]=r;persist();hide();render()};$('tbody').onclick=e=>{const a=e.target.closest('button');if(!a)return;if(a.dataset.edit!==undefined)show(Number(a.dataset.edit));if(a.dataset.del!==undefined&&confirm('Xóa bản ghi này?')){data.splice(Number(a.dataset.del),1);persist();render()}};$('search').oninput=render;async function download(blob,name,types){if(window.showSaveFilePicker){try{const h=await showSaveFilePicker({suggestedName:name,types});const f=await h.createWritable();await f.write(blob);await f.close();return}catch(e){if(e.name==='AbortError')return}}const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}function csv(){const quote=v=>'"'+String(v??'').replace(/"/g,'""')+'"';return '﻿'+[cols,...data.map(r=>cols.map(c=>r[c]??''))].map(x=>x.map(quote).join(',')).join('\r\n')};$('export').onclick=async()=>{const name='pccc_'+new Date().toISOString().slice(0,10);if(window.XLSX){const ws=XLSX.utils.json_to_sheet(data.length?data.map(r=>Object.fromEntries(cols.map(c=>[c,r[c]??'']))):[Object.fromEntries(cols.map(c=>[c,'']))],{header:cols});const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Du lieu');const buf=XLSX.write(wb,{type:'array',bookType:'xlsx'});await download(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),name+'.xlsx',[{description:'Excel',accept:{'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet':['.xlsx']}}])}else{await download(new Blob([csv()],{type:'text/csv;charset=utf-8'}),name+'.csv',[{description:'CSV',accept:{'text/csv':['.csv']}}]);$('msg').textContent='Thư viện XLSX không tải được; đã xuất CSV thay thế.'}};$('backup').onclick=()=>download(new Blob([JSON.stringify({module:key,columns:cols,rows:data},null,2)],{type:'application/json'}),key+'.json',[{description:'JSON',accept:{'application/json':['.json']}}]);$('restore').onclick=()=>$('jsonFile').click();$('jsonFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const p=JSON.parse(await f.text());if(p.module!==key||!Array.isArray(p.rows))throw Error('File không thuộc đúng tiện ích.');if(!confirm('Nhập file sẽ thay toàn bộ dữ liệu cục bộ của tiện ích này, tiếp tục?'))return;data=p.rows;persist();render()}catch(err){alert('Lỗi nhập: '+err.message)}e.target.value=''};window.KTXExcelImporter.init({toolbar:'.toolbar',columns:cols,numericFields:[...nums].map(i=>cols[i]),dateFields:cols.filter(c=>/ngày|thời gian/i.test(c)),getRecords:()=>data.slice(),setRecords:merged=>{try{localStorage.setItem(key,JSON.stringify(merged));data=merged;render();return true}catch(e){return false}}});render()})();
</script><script src="./utility-cloud.js?v=175" defer></script></body></html>
