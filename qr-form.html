<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Đăng ký KTX Hóc Môn</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./qr-config.js"></script><style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#14213a;background:#eef3fb}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:18px;display:grid;place-items:center}.box{width:min(640px,100%);background:#fff;border:1px solid #dbe4f0;border-radius:22px;padding:22px;box-shadow:0 16px 50px #1b2f5a1c}.brand{display:flex;align-items:center;gap:12px;margin-bottom:6px}.logo{min-width:150px;height:54px;padding:0 16px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,#2f6fe8,#6d4bf0);color:#fff;font-weight:900;font-size:15px;letter-spacing:.03em}.brandName{font-weight:900;font-size:19px;letter-spacing:.02em;color:#17233a}h1{font-size:23px;margin:10px 0 0}.sub{font-size:13px;color:#657693;margin:4px 0 16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}.wide{grid-column:1/-1}label{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:650}input,select,textarea{width:100%;padding:12px 13px;border:1px solid #d7e0ee;border-radius:12px;font:inherit;font-size:15px;outline:none;background:#fff}textarea{resize:vertical;min-height:72px}input:focus,select:focus,textarea:focus{border-color:#2f6fe8}input[readonly]{background:#f6f8fc;color:#44546c}button{width:100%;border:0;border-radius:13px;padding:13px 16px;margin-top:14px;font:inherit;font-weight:800;color:#fff;background:linear-gradient(135deg,#159963,#22c98f);cursor:pointer}button.out{background:linear-gradient(135deg,#d99019,#f0ab2b)}button:disabled{opacity:.5}.msg{margin-top:13px;padding:11px 12px;border-radius:11px;font-size:13px;display:none}.ok{display:block;background:#e5f8ef;color:#087a4a}.er{display:block;background:#fde8ea;color:#bb2338}.wn{display:block;background:#fff3d8;color:#9b5b00}.note{font-size:11px;color:#7a899f;line-height:1.45;margin-top:13px}@media(max-width:600px){body{padding:10px}.box{padding:18px 16px}.grid{grid-template-columns:1fr}.wide{grid-column:auto}.brandName{font-size:17px}}</style></head><body><div class="box"><div class="brand"><div class="logo">KTX HÓC MÔN</div></div><h1 id="title"></h1><div class="sub" id="subtitle"></div><div class="grid" id="form"></div><button id="send">Gửi đăng ký</button><div id="msg" class="msg"></div><div class="note">Thông tin được gửi trực tiếp về mục duyệt của Ban quản lý KTX. Vui lòng nhập chính xác thông tin.</div></div><script>
const $=id=>document.getElementById(id),q=new URLSearchParams(location.search),mode=q.get('mode')==='out'?'out':'in',F=$('form');function msg(t,k='ok'){$('msg').className='msg '+k;$('msg').textContent=t}const C=window.KTX_QR_CONFIG||{};let sb=null;try{if(!/^https:\/\//.test(C.url)||!C.key||/PASTE_|YOUR_/i.test(C.key))throw new Error('Biểu mẫu chưa được cấu hình Supabase.');sb=supabase.createClient(C.url,C.key,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}})}catch(e){msg(e.message,'er');$('send').disabled=true}
if(mode==='in'){const today=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Ho_Chi_Minh',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());$('title').textContent='Đăng ký vào KTX Hóc Môn';$('subtitle').textContent='Điền thông tin bên dưới. Hồ sơ chỉ được thêm vào danh sách KTX sau khi Ban quản lý duyệt.';F.innerHTML=`<label class="wide">Họ và tên *<input id="name" autocomplete="name"></label><label>Mã nhân viên<input id="code" autocomplete="off"></label><label>Số CCCD *<input id="cccd" inputmode="numeric"></label><label>Số điện thoại *<input id="phone" inputmode="tel"></label><label>Giới tính *<select id="gender"><option value="">— Chọn giới tính —</option><option>Nam</option><option>Nữ</option></select></label><label>KTX *<select id="ktx"><option value="">— Chọn KTX —</option><option>KTX 1</option><option>KTX 2</option></select></label><label>Ngày sinh *<input id="dob" type="text" inputmode="numeric" maxlength="10" placeholder="DD/MM/YYYY" autocomplete="bday"></label><label>Địa chỉ / Quê quán<input id="address" placeholder="Thôn/Xóm, Xã/Phường, Tỉnh/TP"></label><label>Dãy *<select id="day"><option value="">— Chọn dãy —</option>${Array.from({length:6},(_,i)=>`<option value="Dãy ${i+1}">Dãy ${i+1}</option>`).join('')}</select></label><label>Phòng *<select id="room"><option value="">— Chọn phòng —</option>${Array.from({length:15},(_,i)=>`<option value="${i+1}">Phòng ${i+1}</option>`).join('')}</select></label><label>Đơn vị / Nhà thầu<input id="unit"></label><label>Tiểu đoàn<input id="td"></label><label>Tổ trưởng<input id="leader"></label><label>SĐT tổ trưởng<input id="leader_phone" inputmode="tel"></label><label class="wide">Ngày vào KTX<input id="check_in_date" type="date" value="${today}" readonly></label>`}else{$('title').textContent='Đăng ký ra khỏi KTX';$('subtitle').textContent='Điền thông tin bên dưới. Sau khi Ban quản lý duyệt, dữ liệu sẽ được chuyển khỏi danh sách tổng.';$('send').classList.add('out');F.innerHTML=`<label class="wide">Họ và tên *<input id="name" autocomplete="name"></label><label>Mã nhân viên<input id="code" autocomplete="off"></label><label>Số điện thoại<input id="phone" inputmode="tel"></label><label class="wide">Số CCCD *<input id="cccd" inputmode="numeric"></label><label>Dãy *<select id="day"><option value="">— Chọn dãy —</option>${Array.from({length:6},(_,i)=>`<option value="Dãy ${i+1}">Dãy ${i+1}</option>`).join('')}</select></label><label>Phòng *<select id="room"><option value="">— Chọn phòng —</option>${Array.from({length:15},(_,i)=>`<option value="${i+1}">Phòng ${i+1}</option>`).join('')}</select></label><label class="wide">Lý do ra khỏi KTX *<select id="reason"><option value="">— Chọn lý do —</option><option>Điều chuyển</option><option>Nghỉ việc</option><option>Dọn ra ngoài ở</option><option>Khác</option></select></label>`}
if(mode==='in'&&$('dob')){$('dob').addEventListener('input',e=>{const el=e.target,d=el.value.replace(/\D/g,'').slice(0,8);el.value=d.length<=2?d:d.length<=4?d.slice(0,2)+'/'+d.slice(2):d.slice(0,2)+'/'+d.slice(2,4)+'/'+d.slice(4)});}
const val=id=>$(id)?$(id).value.trim():'';const dobIso=v=>{v=String(v||'').trim();let m=v.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})$/);if(m){const d=m[1].padStart(2,'0'),mo=m[2].padStart(2,'0'),y=m[3],dt=new Date(`${y}-${mo}-${d}T00:00:00`);return dt.getFullYear()==+y&&dt.getMonth()+1==+mo&&dt.getDate()==+d?`${y}-${mo}-${d}`:''}if(/^\d{4}-\d{2}-\d{2}$/.test(v)){const [y,mo,d]=v.split('-').map(Number),dt=new Date(`${v}T00:00:00`);return dt.getFullYear()==y&&dt.getMonth()+1==mo&&dt.getDate()==d?v:''}return ''};$('send').onclick=async()=>{const name=val('name'),code=val('code'),day=val('day'),room=val('room');if(!name)return msg('Vui lòng nhập họ và tên.','wn');if(mode==='out'&&!val('cccd'))return msg('Vui lòng nhập số CCCD.','wn');if(!day)return msg('Vui lòng nhập dãy.','wn');if(!room)return msg('Vui lòng nhập phòng.','wn');if(mode==='out'&&!val('reason'))return msg('Vui lòng chọn lý do ra khỏi KTX.','wn');if(mode==='in'&&!val('cccd'))return msg('Vui lòng nhập số CCCD.','wn');if(mode==='in'&&!val('phone'))return msg('Vui lòng nhập số điện thoại.','wn');if(mode==='in'&&!val('dob'))return msg('Vui lòng nhập ngày sinh.','wn');const dob=mode==='in'?dobIso(val('dob')):null;if(mode==='in'&&!dob)return msg('Ngày sinh không hợp lệ. Vui lòng nhập theo dạng DD/MM/YYYY, ví dụ 04/10/1986.','wn');if(mode==='in'&&!val('gender'))return msg('Vui lòng chọn giới tính.','wn');if(mode==='in'&&!val('ktx'))return msg('Vui lòng chọn KTX.','wn');$('send').disabled=true;$('send').textContent='Đang gửi...';const payload={request_type:mode,worker_code:code||null,name,day,room,cccd:val('cccd')?val('cccd').replace(/\D/g,''):null,phone:val('phone')?val('phone').replace(/\D/g,''):null,dob,gender:mode==='in'?val('gender'):null,unit:mode==='in'?val('unit')||null:null,td:mode==='in'?val('td')||null:null,leader:mode==='in'?val('leader')||null:null,leader_phone:mode==='in'?val('leader_phone').replace(/\D/g,'')||null:null,address:mode==='in'?val('address')||null:null,ktx:mode==='in'?val('ktx')||null:null,check_in_date:mode==='in'?val('check_in_date')||null:null,reason:mode==='out'?val('reason')||null:null};try{const {error}=await sb.from('residency_requests').insert(payload);if(error)throw error;msg(mode==='in'?'Đã gửi đăng ký vào KTX. Vui lòng chờ Ban quản lý duyệt.':'Đã gửi đăng ký ra khỏi KTX. Vui lòng chờ Ban quản lý duyệt.','ok');$('send').textContent='Đã gửi thành công'}catch(e){msg('Không gửi được: '+(e.message||e),'er');$('send').disabled=false;$('send').textContent='Gửi đăng ký'}};
</script><script src="./cccd-scan.js"></script></body></html>
