ing:24px}.vendorname{display:block;color:#426b9d;font-size:11px;font-weight:500;margin-top:4px}.hint{font-size:12px;color:#617996;margin-top:12px}@media(max-width:600px){body{padding:9px}.panel{padding:12px}.filter{grid-template-columns:1fr 1fr}.filter label:last-child{grid-column:1/-1}.bar button,.bar .filebtn{flex:1;text-align:center}h1{font-size:21px}td,th{padding:9px 6px}}

:root{--bl:#2f6fe8;--bl2:#6d4bf0;--gr:#12935c;--mut:#5b6c8a;--ln:#dbe3f0;--pn:#fff;--pn2:#f3f6fc;--ink:#13203a;--gl:#2f6fe81f}
.mtseg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}.mtseg button{font-size:14px;font-weight:700;padding:12px}.mtseg button.on{color:#fff;background:linear-gradient(135deg,var(--bl),var(--bl2));border-color:transparent}.mtw{overflow:auto;border:1px solid var(--ln);border-radius:12px}.mtt{width:100%;border-collapse:collapse;font-size:14px}.mtt th{text-align:left;background:#e7efff;color:#536987;font-weight:700;padding:10px}.mtt td{border-bottom:1px solid var(--ln);padding:10px;vertical-align:middle}.mtt tbody tr:nth-child(even){background:#f6f9ff}.mtn{color:#b45f00;font-weight:700}.mtin{display:inline-flex;gap:6px;align-items:center}.mtin input{width:88px;min-height:38px;padding:8px}.mtin i{font-size:12px;color:var(--mut);font-style:normal}.mtb{display:inline-block;padding:4px 10px;border-radius:30px;background:#e6f0ff;color:#2a5bd7;font-size:12px;font-weight:700}.mtb.g{background:#dcf5e6;color:#0d7a3e}.mtb.r{background:#fde2e4;color:#b4232f}.mtsb{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;background:#f3f6fc;border:1px solid var(--ln);padding:11px 14px;border-radius:10px;margin-top:10px}.mt-st{padding:10px 12px;margin-top:10px;border-radius:10px;background:#eaf2ff}.mt-st.no{background:#fff1e7}.mini-note{color:var(--mut);font-size:12px;margin-top:9px}.rowbar{display:flex;gap:8px;flex-wrap:wrap;margin:11px 0 0;align-items:center}.rowbar button,.rowbar .filebtn{flex:none}.weight-control{width:110px!important}.filebtn[hidden]{display:none!important}@media(max-width:640px){.filter{grid-template-columns:1fr 1fr}.filter label:last-child{grid-column:1/-1}.mtt{font-size:12px}.mtt th,.mtt td{padding:8px 5px}.mtin input{width:68px}.rowbar button,.rowbar .filebtn{flex:1;text-align:center}}
</style></head><body><main><h1>🍽 Theo dõi suất ăn</h1><div class="sub">Xem tên món và định lượng chuẩn · Thực đơn mặn / chay, đối chiếu với cân thực tế</div>
<section class="panel"><div class="filter"><label>Ngày ăn<input type="date" id="date"></label><label>Bữa ăn<select id="period"><option value="sang">Sáng</option><option value="trua" selected>Trưa</option><option value="chieu">Chiều / Tối</option></select></label><label>Nhà cung cấp<select id="vendor"></select></label></div>
<div class="rowbar"><label>Dung sai (%)<input class="weight-control" id="tolerance" type="number" min="0" step="1" value="0"></label></div>
<div class="rowbar"><button class="primary" id="viewMenu">Xem thực đơn</button><label class="filebtn" id="importLabel">↥ Chọn nhiều file Excel<input id="files" type="file" accept=".xlsx,.xls,.xlsm,.csv" multiple hidden></label><button id="cloudLoad">↻ Xem trên Cloud</button><button class="adminOnly" id="cloudSave" disabled>☁ Lưu thực đơn đã xem lên Cloud</button><button id="exportExcel">↓ Xuất phiếu đối chiếu (Excel)</button></div>
<div class="mini-note">Nhân viên chỉ xem; Quản trị có thể cập nhật. Dữ liệu cân thực tế lưu tạm trên thiết bị này; dữ liệu thực đơn đã duyệt lưu lên Cloud.</div>
<div class="mt-st" id="mt_st"></div><div class="status" id="status">Đang khởi tạo…</div><div class="log" id="results" hidden></div></section>
<section class="panel" id="mt_card"></section></main><script>
(()=>{'use strict';
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sa=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
const norm=sa, MTS=[['sang','Sáng'],['trua','Trưa'],['chieu','Chiều']];
const NCCS=['Vina Story','Tám Phương','Thiên Hồng Phúc','Lim Dương','Hương Ngọc Phát','Nguyên Sài Gòn','Minh Long Food'];
const NCC_KEY={'Vina Story':['vina'],'Tám Phương':['tam phuong'],'Thiên Hồng Phúc':['thien hong phuc'],'Lim Dương':['lim duong'],'Hương Ngọc Phát':['huong ngoc phat'],'Nguyên Sài Gòn':['nguyen sai gon'],'Minh Long Food':['minh long']};
const mealDetect=txt=>{const s=sa(txt),h=NCCS.filter(n=>NCC_KEY[n].some(k=>s.includes(k)));return h.length===1?h[0]:null};
const today=()=>{const d=new Date();return[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
let MENU={},dirty=new Set(),isAdmin=false;
let MTACT={};try{MTACT=JSON.parse(localStorage.getItem('ktx_ref_mt_act')||'{}')}catch(e){}
const MT={date:today(),ses:(h=>h<10?'sang':h<16?'trua':'chieu')(new Date().getHours()),ncc:NCCS[0],kind:'man',tol:0};
function bridge(){const b=window.parent?.KTX_MEAL_BRIDGE;if(!b?.client||!b?.session?.user)throw Error('Chưa kết nối tài khoản ứng dụng KTX');return b}
const note=(s,bad=false)=>{$('status').textContent=s;$('status').classList.toggle('error',bad)};
const mtDay=(n,k,iso)=>MENU[n]?.[k]?.[iso]||null;
const mtList=(n,k,iso,s)=>{const d=mtDay(n,k,iso);return (d?.[s]||[]).map((ten,i)=>({i,ten,dl:d?.q?.[s]?.[i]||''}))};
const mtF=n=>(Math.round(n*10)/10).toLocaleString('vi-VN'),mtDMY=i=>String(i||'').split('-').reverse().join('/');
function mtRange(t){const s=String(t||'').toLowerCase().replace(/(\d),(\d)/g,'$1.$2');let lo=0,hi=0,unit=null,n=0,bad=false;
 const re=/(\d+(?:\.\d+)?)\s*(?:-|–|—|đến)\s*(\d+(?:\.\d+)?)\s*(kg|gram|gr|g|ml|l)?(?![a-zà-ỹ])|(\d+(?:\.\d+)?)\s*(kg|gram|gr|g|ml|l)(?![a-zà-ỹ])/g;let m;
 while((m=re.exec(s))){let a,b,u;if(m[1]!==undefined){a=+m[1];b=+m[2];u=m[3]||'g'}else{a=b=+m[4];u=m[5]}
  let f=1,uu=u;if(u=='kg'){f=1000;uu='g'}else if(u=='l'){f=1000;uu='ml'}else if(u=='gram'||u=='gr'||u=='g')uu='g';
  if(unit&&unit!=uu)bad=true;unit=uu;lo+=Math.min(a,b)*f;hi+=Math.max(a,b)*f;n++}
 return n&&!bad?{min:lo,max:hi,unit,n}:null}

function mtJudge(rg,v,tol){if(!rg||v===''||v==null||isNaN(+v))return null;const a=+v,lo=rg.min*(1-tol/100),hi=rg.max*(1+tol/100);
 if(a<lo)return{ok:false,t:`Thiếu ${mtF(rg.min-a)} ${rg.unit}`};if(a>hi)return{ok:false,t:`Dư ${mtF(a-rg.max)} ${rg.unit}`};return{ok:true,t:'Đạt'}}

const mtKey=k=>`${MT.ncc}|${k}|${MT.date}|${MT.ses}`;
function mtSum(kind){const L=mtList(MT.ncc,kind,MT.date,MT.ses),A=MTACT[mtKey(kind)]||{};let std=0,w=0,ok=0,fail=0;L.forEach(r=>{const rg=mtRange(r.dl);if(!rg)return;std++;const j=mtJudge(rg,A[r.i],MT.tol);if(j){w++;j.ok?ok++:fail++}});return{total:L.length,std,weighed:w,ok,fail}}
function mtSetStatus(){const man=mtList(MT.ncc,'man',MT.date,MT.ses).length,chay=mtList(MT.ncc,'chay',MT.date,MT.ses).length,e=$('mt_st');e.className='mt-st '+(man||chay?'ok':'no');e.textContent=man||chay?`Đã tải: ${man} món mặn, ${chay} món chay.`:'Chưa có thực đơn cho đúng ngày, bữa và nhà cung cấp này. Hãy chọn file Excel hoặc đổi ngày, bữa, nhà cung cấp.'}
function mtRender(){mtSetStatus();const sn=MTS.find(x=>x[0]===MT.ses)[1],L=mtList(MT.ncc,MT.kind,MT.date,MT.ses),A=MTACT[mtKey(MT.kind)]||{},kn=MT.kind==='man'?'Mặn':'Chay';
const rows=L.map(r=>{const rg=mtRange(r.dl),j=rg?mtJudge(rg,A[r.i],MT.tol):null;return `<tr><td class="mtn">${r.i+1}</td><td><b>${esc(r.ten)}</b></td><td>${r.dl?esc(r.dl)+(rg?`<div class="mini-note">Chuẩn: ${mtF(rg.min)}${rg.max!==rg.min?'–'+mtF(rg.max):''} ${rg.unit}${rg.n>1?' (tổng '+rg.n+' thành phần)':''}</div>`:'<div class="mini-note">Tính theo số lượng, kiểm đếm thủ công</div>'):'<span class="mini-note">Chưa có định lượng trong file Excel</span>'}</td><td>${rg?`<span class="mtin"><input type="number" min="0" step="any" inputmode="decimal" data-i="${r.i}" value="${esc(A[r.i]??'')}" aria-label="Cân thực tế món ${esc(r.ten)}"><i>${rg.unit}</i></span>`:'—'}</td><td data-r="${r.i}">${j?`<span class="mtb ${j.ok?'g':'r'}">${j.t}</span>`:'—'}</td></tr>`}).join('');
$('mt_card').innerHTML=`<div class="topline"><h2>${kn} · ${sn} · ${MT.date}</h2><span class="mtb ${isAdmin?'g':''}">${isAdmin?'Chế độ cập nhật':'Chế độ chỉ xem'}</span></div><div class="mtseg"><button data-k="man" class="${MT.kind==='man'?'on':''}">🥩 Thực đơn mặn</button><button data-k="chay" class="${MT.kind==='chay'?'on':''}">🌿 Thực đơn chay</button></div>${L.length?`<div class="mtw"><table class="mtt"><thead><tr><th style="width:44px">#</th><th>Tên món</th><th>Định lượng chuẩn</th><th>Cân thực tế</th><th>Kết quả</th></tr></thead><tbody>${rows}</tbody></table></div><div id="mt_sum"></div>`:`<p class="mini-note">Chưa có thực đơn ${kn.toLowerCase()} cho ngày, bữa và nhà cung cấp này.</p>`}`;
$('mt_card').querySelectorAll('.mtseg button').forEach(b=>b.onclick=()=>{MT.kind=b.dataset.k;mtRender()});
$('mt_card').querySelectorAll('input[data-i]').forEach(inp=>inp.oninput=()=>{const k=mtKey(MT.kind);(MTACT[k]=MTACT[k]||{})[inp.dataset.i]=inp.value;try{localStorage.setItem('ktx_ref_mt_act',JSON.stringify(MTACT))}catch(e){};const r=L.find(x=>x.i==inp.dataset.i),j=mtJudge(mtRange(r.dl),inp.value,MT.tol),c=$('mt_card').querySelector(`[data-r="${r.i}"]`);c.innerHTML=j?`<span class="mtb ${j.ok?'g':'r'}">${j.t}</span>`:'—';mtSumRender()});mtSumRender()}
function mtSumRender(){const e=$('mt_sum');if(!e)return;const s=mtSum(MT.kind),a=mtSum('man'),b=mtSum('chay'),w=a.weighed+b.weighed,f=a.fail+b.fail;const verdict=!w?'Chưa nhập số cân':f?`Không đạt · ${f} món lệch`:`Đạt · ${w} món đã cân`;e.innerHTML=`<div class="mtsb"><span>Đã cân <b>${s.weighed}/${s.std}</b> món có định lượng${s.total>s.std?` (${s.total-s.std} món tính theo số lượng)`:''}</span><span>Kết luận cân định lượng (mặn và chay): <b>${esc(verdict)}</b></span></div><div class="rowbar"><button class="primary" id="mt_report">Đưa kết quả vào Báo cáo suất ăn</button><button id="mt_clear">Xóa số đã nhập</button></div>`;
$('mt_report').onclick=()=>{if(!w)return note('Chưa nhập số cân nào để kết luận.',true);const s=`Cân định lượng ${MT.ncc} ngày ${mtDMY(MT.date)} (${MTS.find(x=>x[0]===MT.ses)[1]}): ${f?'Không đạt':'Đạt'}; đã cân ${w} món, ${f} món lệch.`;navigator.clipboard?.writeText(s).then(()=>note('Đã sao chép kết quả để dán vào Báo cáo suất ăn.')).catch(()=>note(s))};$('mt_clear').onclick=()=>{delete MTACT[mtKey(MT.kind)];localStorage.setItem('ktx_ref_mt_act',JSON.stringify(MTACT));mtRender()}}
function menuParse(rows,sheetName){
 const clean=s=>String(s==null?'':s).replace(/\s+/g,' ').trim(),cap=s=>{if(!s)return s;if(s===s.toUpperCase()&&/[A-ZÀ-Ỹ]/.test(s))s=s.toLowerCase();return s.charAt(0).toUpperCase()+s.slice(1)};
 const hdrTxt=(rows.slice(0,6)).flat().map(clean).join(' | ');
 const kind=(/chay/i.test(sheetName)||/THỰC ĐƠN CHAY|MENU CHAY/i.test(hdrTxt))?'chay':'man';
 let hr=-1;const cols={};
 for(let i=0;i<Math.min(10,rows.length)&&hr<0;i++){(rows[i]||[]).forEach((c,j)=>{const t=clean(c).toLowerCase();if(/^sáng$/.test(t))cols.sang=j;else if(/^trưa$/.test(t))cols.trua=j;else if(/^(tối|chiều)$/.test(t))cols.chieu=j;else if(/^thứ$/.test(t)&&cols.day==null)cols.day=j});if(cols.sang!=null||cols.trua!=null||cols.chieu!=null)hr=i}
 if(hr<0)return null;
 const dc={sang:cols.sang??2,trua:cols.trua??5,chieu:cols.chieu??8},dayCol=cols.day??Math.max(0,Math.min(dc.sang,dc.trua,dc.chieu)-1);
 /* khoảng ngày của tuần: 2 ngày đầy đủ dd/mm/yyyy trong phần đầu sheet */
 let r0=null,r1=null;
 for(let i=0;i<hr&&!r0;i++)for(const c of rows[i]||[]){const m=[...clean(c).matchAll(/(\d{1,2})\s*[\/.]\s*(\d{1,2})\s*[\/.]\s*(\d{4})/g)];if(m.length>=2){r0=new Date(+m[0][3],+m[0][2]-1,+m[0][1]);r1=new Date(+m[1][3],+m[1][2]-1,+m[1][1]);break}}
 const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
 const stop=r=>(rows[r]||[]).some(c=>/NHÀ CUNG CẤP|ĐẠI DIỆN|PHÒNG HÀNH CHÍNH/i.test(clean(c)));
 const starts=[];
 for(let r=hr+1;r<rows.length;r++){if(stop(r))break;const t=clean((rows[r]||[])[dayCol]);if(/^(thứ|cn|chủ)/i.test(t)||/\d{1,2}\s*[\/.]\s*\d{1,2}/.test(t))starts.push([r,t])}
 const dateOf=(t)=>{
  const m=t.match(/(\d{1,2})\s*[\/.]\s*(\d{1,2})(?!\s*[\/.]\s*\d)/);
  if(m){const d=+m[1],mo=+m[2];if(r0&&r1){for(let x=new Date(r0);x<=r1;x=new Date(x.getFullYear(),x.getMonth(),x.getDate()+1))if(x.getDate()==d&&x.getMonth()+1==mo)return iso(x)}
   const y=r0?(mo>=r0.getMonth()+1?r0.getFullYear():(r1||r0).getFullYear()):new Date().getFullYear();return `${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`}
  if(!r0||!r1)return null;
  const wd=/CN|chủ/i.test(t)?6:(+((t.match(/\d/)||[])[0])-2);
  for(let x=new Date(r0);x<=r1;x=new Date(x.getFullYear(),x.getMonth(),x.getDate()+1))if((x.getDay()+6)%7==wd)return iso(x);
  return null};
 const days={};
 starts.forEach(([r,t],k)=>{let e=k+1<starts.length?starts[k+1][0]:rows.length;for(let q=r;q<e;q++)if(stop(q)){e=q;break}
  const key=dateOf(t);if(!key)return;const o={sang:[],trua:[],chieu:[],q:{sang:[],trua:[],chieu:[]}};
  for(const s of ['sang','trua','chieu']){const c=dc[s],items=[];let cur=null;
   for(let q=r;q<e;q++){const t2=clean((rows[q]||[])[c]),wr=String((rows[q]||[])[c+1]==null?'':(rows[q]||[])[c+1]).split(/\n/).map(clean).filter(Boolean).join('; ');
    if(t2){cur={ten:cap(t2),dl:[]};items.push(cur)}
    if(wr){if(s=='sang'&&/^sữa/i.test(wr)){items.push({ten:cap(wr.split(':')[0].trim()),dl:[wr.split(':').slice(1).join(':').trim()]})}else if(cur)cur.dl.push(wr)}}
   const seen=new Set(),U=items.filter(x=>{const k2=x.ten.toLowerCase();if(seen.has(k2))return false;seen.add(k2);return true}).map(x=>({ten:x.ten,dl:x.dl.join('; ')}));
   const rice=U.filter(x=>/^cơm\b/i.test(x.ten)),rest=U.filter(x=>!/^cơm\b/i.test(x.ten)),ord=[...rice,...rest];o[s]=ord.map(x=>x.ten);o.q[s]=ord.map(x=>x.dl)}
  days[key]=o});
 return{kind,days}}

function sync(){MT.date=$('date').value;MT.ses=$('period').value;MT.ncc=$('vendor').value;MT.tol=Math.max(0,+$('tolerance').value||0);mtRender()}
function addParsed(n,r){for(const iso in r.days){((MENU[n]=MENU[n]||{})[r.kind]=MENU[n][r.kind]||{})[iso]=r.days[iso];dirty.add(`${iso}|${n}|${r.kind}`)}}
$('files').onchange=async e=>{const fs=[...e.target.files];e.target.value='';if(!fs.length)return;const logs=[];let done=0,first=null,firstN=null;for(const file of fs){try{const xlsx=window.XLSX||window.parent?.XLSX;if(!xlsx?.read)throw Error('Không tải được thư viện Excel');const wb=xlsx.read(await file.arrayBuffer(),{type:'array'});const head=wb.SheetNames.slice(0,3).map(n=>xlsx.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:false,defval:''}).slice(0,4).flat().join(' ')).join(' ');const ncc=mealDetect(file.name+' '+head)||MT.ncc;let count=0;
for(const sn of wb.SheetNames){const rows=xlsx.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:false,defval:''});const result=menuParse(rows,sn);if(!result)continue;addParsed(ncc,result);count+=Object.keys(result.days).length;if(!first){first=Object.keys(result.days)[0];firstN=ncc}}
if(!count)throw Error('Không thấy thực đơn theo cột SÁNG / TRƯA / TỐI.');done++;logs.push(`✓ ${file.name}: ${count} ngày/loại · ${ncc}`)}catch(ex){logs.push(`✕ ${file.name}: ${ex.message}`)}}
if(first){MT.ncc=firstN;$('vendor').value=firstN;if(!mtDay(MT.ncc,'man',MT.date)&&!mtDay(MT.ncc,'chay',MT.date)){MT.date=first;$('date').value=first}}
$('results').hidden=false;$('results').textContent=logs.join('\n');mtRender();note(`Đã đọc ${done}/${fs.length} file. Dữ liệu đang xem trước trên thiết bị; chỉ lưu Cloud khi người có quyền nhấn nút Lưu.`,!done);cloudButton()};
function cloudButton(){$('cloudSave').disabled=!isAdmin||!dirty.size;$('cloudSave').textContent=`☁ Lưu thực đơn đã xem lên Cloud${dirty.size?' ('+dirty.size+')':''}`}
$('cloudSave').onclick=async()=>{if(!isAdmin)return;const b=bridge();if(!dirty.size)return;const pending=[...dirty];if(!confirm(`Lưu ${pending.length} thực đơn theo ngày/NCC/loại lên Supabase?`))return;let n=0;for(const k of pending){const [date,vendor,kind]=k.split('|'),d=mtDay(vendor,kind,date);if(!d)continue;for(const p of ['sang','trua','chieu']){const dishes=(d[p]||[]).map((name,i)=>({name,standard:d.q?.[p]?.[i]||''}));if(!dishes.length)continue;const payload={meal_date:date,meal_period:p,vendor,menu_type:kind,dishes,updated_by:b.session.user.id,updated_at:new Date().toISOString()};const {error}=await b.client.from('ktx_meal_menus').upsert(payload,{onConflict:'meal_date,meal_period,vendor,menu_type'});if(error)return note(`Lỗi lưu ${vendor}: ${error.message}`,true)}dirty.delete(k);n++}cloudButton();note(`Đã lưu ${n} thực đơn lên Cloud.`)};
$('cloudLoad').onclick=async()=>{try{const b=bridge(),q=b.client.from('ktx_meal_menus').select('meal_date,meal_period,vendor,menu_type,dishes').eq('meal_date',MT.date).eq('meal_period',MT.ses).eq('vendor',MT.ncc);const {data,error}=await q;if(error)throw error;for(const row of data||[]){const o=((MENU[row.vendor]=MENU[row.vendor]||{})[row.menu_type]=MENU[row.vendor][row.menu_type]||{});const d=o[row.meal_date]=o[row.meal_date]||{sang:[],trua:[],chieu:[],q:{sang:[],trua:[],chieu:[]}};if(!dirty.has(`${row.meal_date}|${row.vendor}|${row.menu_type}`)){d[row.meal_period]=(row.dishes||[]).map(x=>x.name);d.q[row.meal_period]=(row.dishes||[]).map(x=>x.standard||'')}}mtRender();note(`Đã tải ${(data||[]).length} bảng thực đơn từ Cloud.`)}catch(ex){note('Lỗi đọc Cloud: '+ex.message,true)}};
$('exportExcel').onclick=()=>{try{const xlsx=window.XLSX||window.parent?.XLSX;if(!xlsx?.utils)throw Error('Thư viện Excel chưa sẵn sàng');const wb=xlsx.utils.book_new();let any=false;for(const k of ['man','chay']){const L=mtList(MT.ncc,k,MT.date,MT.ses);if(!L.length)continue;any=true;const A=MTACT[`${MT.ncc}|${k}|${MT.date}|${MT.ses}`]||{},rows=[['PHIẾU ĐỐI CHIẾU ĐỊNH LƯỢNG'],[`Nhà cung cấp: ${MT.ncc}`],[`Ngày: ${mtDMY(MT.date)}  Bữa: ${MT.ses}  Suất: ${k==='man'?'Mặn':'Chay'}`],[],['STT','Tên món','Định lượng chuẩn','Cân thực tế','Kết quả']];L.forEach(r=>{const rg=mtRange(r.dl),v=A[r.i]??'',j=mtJudge(rg,v,MT.tol);rows.push([r.i+1,r.ten,r.dl,v,j?.t||''])});const ws=xlsx.utils.aoa_to_sheet(rows);ws['!cols']=[{wch:6},{wch:38},{wch:52},{wch:16},{wch:25}];xlsx.utils.book_append_sheet(wb,ws,k==='man'?'Mặn':'Chay')}if(!any)return note('Chưa có thực đơn để xuất.',true);xlsx.writeFile(wb,`Doi_chieu_dinh_luong_${MT.date}_${sa(MT.ncc).replace(/ /g,'_')}.xlsx`)}catch(ex){note('Không xuất được Excel: '+ex.message,true)}};
for(const id of ['date','period','vendor'])$(id).onchange=sync;$('tolerance').oninput=sync;$('viewMenu').onclick=sync;
function init(){try{const b=bridge();isAdmin=sa(b.role)==='admin';const list=b.vendors?.length?b.vendors:NCCS;$('vendor').innerHTML=list.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('');MT.ncc=list[0];document.querySelectorAll('.adminOnly').forEach(el=>el.hidden=!isAdmin);$('importLabel').hidden=!isAdmin;note(isAdmin?'Chế độ cập nhật: chọn file Excel để xem trước và lưu lên Cloud.':'Chế độ xem: chọn ngày, bữa, NCC rồi nhấn Xem trên Cloud.')}catch(e){$('vendor').innerHTML=NCCS.map(v=>`<option>${esc(v)}</option>`).join('');note('Chưa kết nối tài khoản KTX: '+e.message,true)}$('date').value=MT.date;$('period').value=MT.ses;$('vendor').value=MT.ncc;cloudButton();mtRender()}
init();
})();
